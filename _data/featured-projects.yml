- name: Robot Sensor Recorder
  url: ""
  client_code: ""
  server_code: https://github.com/ping58972/robot-sensor-recorder
  description: A C++20 device-side recording prototype for robotics data collection. Four producer threads simulate video, audio, IMU, and device-status sources and feed a bounded producer-consumer queue that one storage thread writes into segmented binary logs with sequence numbers, nanosecond timestamps, per-record CRC32 checksums, fsync, and rename-based segment commits. Includes Linux UDP socket and termios serial input adapters, a recovery tool for partial segments, fault-injection tests, and a Dockerized Ubuntu/GCC build, measured at about 20 MiB/s on synthetic data.
  used:
    - thing: C++20
    - thing: Linux
    - thing: Multithreading
    - thing: CMake
    - thing: UDP Sockets
    - thing: Serial (termios)
    - thing: CRC32
    - thing: Docker
    - thing: Python

- name: Shared-Memory Sensor Bus
  url: ""
  client_code: ""
  server_code: https://github.com/ping58972/shared-memory-sensor-bus
  description: A C++20 publish-subscribe middleware prototype for local robotics processes. One publisher and independent subscribers exchange topic-tagged payloads through a bounded, file-backed shared-memory ring buffer (mmap MAP_SHARED) with zero-copy producer and consumer callbacks, flock-based read leases, per-subscriber cursors, topic filtering, sequence-loss detection, and checksum validation. Validated with process-crash and multi-process integration tests on Dockerized Ubuntu and macOS, and benchmarked at about 168,000 messages per second for 4 KB payloads.
  used:
    - thing: C++20
    - thing: Shared Memory (mmap)
    - thing: IPC
    - thing: Publish-Subscribe
    - thing: Zero-Copy
    - thing: Linux
    - thing: CMake
    - thing: Docker
    - thing: Python
