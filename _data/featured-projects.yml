  url: ""
  client_code: ""
  server_code: https://github.com/ping58972/Robot-Wall-Following-by-Reinforcement-Learning
  description: Trains simulated mobile robots to follow a right-hand wall using tabular Q-learning and SARSA, reducing a noisy 360-degree LiDAR stream to a compact discrete state and learning a policy over repeated episodes. Shows the full engineering progression from an original ROS1 Stingray implementation to a reproducible, Dockerized ROS2 Jazzy and Gazebo Harmonic redesign for macOS, including 500-episode reward histories and learning-curve analysis for both algorithms.
