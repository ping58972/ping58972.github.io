- name: Robot Localization Using Particle Filters
  url: ""
  client_code: ""
  server_code: https://github.com/ping58972/Robot-Localization-Using-Particle-Filters-ROS2
  description: End-to-end Monte Carlo Localization for a TurtleBot3 with a 2D LiDAR, porting a COMPSCI 603 ROS1 implementation to ROS2 Jazzy. Implements a vectorized probabilistic odometry motion model and a likelihood-field sensor model built from an occupancy map, then runs a full particle-filter cycle of predict, correct, estimate, and resample. Packaged as a reproducible Ubuntu 24.04 / Gazebo Harmonic Docker container that streams Gazebo and RViz to macOS through a browser-based noVNC desktop.
  used:
    - thing: ROS2 Jazzy
    - thing: Python
    - thing: Particle Filter
